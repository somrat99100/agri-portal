<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbxoZKLYwKNpgX3DsBLWVRrrPDk4BghJ53dcFIo06wdY06C8whH7hSFpO7ppV444RRPD/exec">
<title>Agriculture Department — Ranking Portal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1E3D08, #3B6D11);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .box {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(192,221,151,0.3);
    border-radius: 20px;
    padding: 2.5rem 2rem;
    text-align: center;
    max-width: 360px;
    width: 100%;
  }
  .leaf { font-size: 52px; margin-bottom: 1rem; }
  h1 { font-size: 20px; font-weight: 700; color: #EAF3DE; margin-bottom: 6px; }
  p  { font-size: 13px; color: #97C459; margin-bottom: 1.5rem; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid rgba(192,221,151,0.2);
    border-top-color: #C0DD97;
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin: 0 auto 1.25rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .open-btn {
    display: inline-block;
    background: #76B82A;
    color: #fff;
    padding: 13px 28px;
    border-radius: 30px;
    text-decoration: none;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .3px;
    -webkit-tap-highlight-color: transparent;
  }
  .open-btn:active { background: #5A9020; }
  .note { font-size: 11px; color: rgba(192,221,151,0.6); margin-top: 1rem; }
</style>
<script>
  // Try multiple methods to open the portal
  (function() {
    var url = "https://script.google.com/macros/s/AKfycbxoZKLYwKNpgX3DsBLWVRrrPDk4BghJ53dcFIo06wdY06C8whH7hSFpO7ppV444RRPD/exec";
    // Method 1: immediate replace (no back button, avoids redirect loop)
    try { window.location.replace(url); } catch(e) {}
  })();
</script>
</head>
<body>
<div class="box">
  <div class="leaf">&#127806;</div>
  <h1>Agriculture Department</h1>
  <p>Result Ranking Portal</p>
  <div class="spinner"></div>
  <a class="open-btn" href="https://script.google.com/macros/s/AKfycbxoZKLYwKNpgX3DsBLWVRrrPDk4BghJ53dcFIo06wdY06C8whH7hSFpO7ppV444RRPD/exec" target="_top">Open Portal</a>
  <p class="note">Tap the button if not redirected automatically</p>
</div>
</body>
</html>
